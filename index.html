<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>% Change</title>
  <style>
    html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#0d0d1a;color:#fff;}
    #root{height:100%;display:flex;justify-content:center;align-items:center;padding:10px;}
    .card{background:rgba(20,20,35,0.95);border:1px solid #2a2a4a;border-radius:12px;padding:16px 24px;width:100%;max-width:340px;}
    .symbol{color:#aaa;font-size:13px;font-weight:500;text-align:center;margin-bottom:12px;letter-spacing:1px;text-transform:uppercase;}
    .row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #1e1e30;}
    .row:last-child{border-bottom:none;}
    .lbl{color:#888;font-size:18px;font-weight:600;min-width:40px;}
    .val{font-size:26px;font-weight:700;}
    .pos{color:#00e676;}
    .neg{color:#ff1744;}
    .neu{color:#888;}
    .status{color:#555;font-size:11px;text-align:center;margin-top:10px;}
  </style>
</head>
<body>
<div id="root">
  <div class="card">
    <div class="symbol" id="sym">Loading...</div>
    <div class="row"><span class="lbl">5m</span><span class="val neu" id="v5m">--</span></div>
    <div class="row"><span class="lbl">1h</span><span class="val neu" id="v1h">--</span></div>
    <div class="row"><span class="lbl">1D</span><span class="val neu" id="v1d">--</span></div>
    <div class="status" id="status">Loading...</div>
  </div>
</div>

<script>
  // Map cTrader symbol names to Yahoo Finance tickers
  const symbolMap = {
    "XAUUSD": "GC=F",
    "XAGUSD": "SI=F",
    "BTCUSD": "BTC-USD",
    "ETHUSD": "ETH-USD",
    "EURUSD": "EURUSD=X",
    "GBPUSD": "GBPUSD=X",
    "USDX":   "DX-Y.NYB",
    "SpotCrude": "CL=F",
    "OIL":    "CL=F"
  };

  // Get symbol from cTrader query string
  const params = new URLSearchParams(window.location.search);
  const ctSymbol = params.get("symbol") || "XAUUSD";
  const yahooTicker = symbolMap[ctSymbol] || "GC=F";

  document.getElementById("sym").innerText = ctSymbol;

  function updateRow(id, change) {
    const el = document.getElementById(id);
    if (change === null || isNaN(change)) { el.innerText = "--"; el.className = "val neu"; return; }
    el.innerText = (change >= 0 ? "+" : "") + change.toFixed(2) + "%";
    el.className = "val " + (change > 0 ? "pos" : change < 0 ? "neg" : "neu");
  }

  async function fetchChanges() {
    try {
      document.getElementById("status").innerText = "Updating...";

      // Use Yahoo Finance API via allorigins proxy to avoid CORS
      const url = `https://api.allorigins.win/get?url=${encodeURIComponent(`https://query1.finance.yahoo.com/v8/finance/chart/${yahooTicker}?interval=5m&range=1d`)}`;
      const res  = await fetch(url);
      const data = await res.json();
      const json = JSON.parse(data.contents);

      const quotes   = json?.chart?.result?.[0];
      const closes   = quotes?.indicators?.quote?.[0]?.close;
      const timestamps = quotes?.timestamp;

      if (!closes || closes.length < 2) {
        document.getElementById("status").innerText = "No data";
        return;
      }

      // Current price (last non-null)
      const lastPrice = closes.filter(c => c !== null).slice(-1)[0];

      // 5m ago price
      const price5m = closes.filter(c => c !== null).slice(-2)[0];

      // 1h ago price (12 x 5m bars)
      const idx1h   = Math.max(0, closes.filter(c => c !== null).length - 13);
      const price1h = closes.filter(c => c !== null)[idx1h];

      // 1D = first price of the day
      const price1d = closes.find(c => c !== null);

      updateRow("v5m", price5m  ? ((lastPrice - price5m)  / price5m)  * 100 : null);
      updateRow("v1h", price1h  ? ((lastPrice - price1h)  / price1h)  * 100 : null);
      updateRow("v1d", price1d  ? ((lastPrice - price1d)  / price1d)  * 100 : null);

      document.getElementById("status").innerText = "Updated: " + new Date().toLocaleTimeString();
    } catch(e) {
      document.getElementById("status").innerText = "Error: " + e.message;
    }

    setTimeout(fetchChanges, 15000); // refresh every 15 seconds
  }

  fetchChanges();
</script>
</body>
</html>
