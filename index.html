<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>% Change</title>
  <style>
    html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#0d0d1a;color:#fff;}
    #root{height:100%;display:flex;justify-content:center;align-items:center;padding:10px;}
    .card{background:rgba(20,20,35,0.95);border:1px solid #2a2a4a;border-radius:12px;padding:16px 24px;width:100%;max-width:340px;}
    .symbol{color:#aaa;font-size:13px;font-weight:500;text-align:center;margin-bottom:12px;letter-spacing:1px;text-transform:uppercase;}
    .row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #1e1e30;}
    .row:last-child{border-bottom:none;}
    .lbl{color:#888;font-size:18px;font-weight:600;min-width:40px;}
    .val{font-size:26px;font-weight:700;}
    .pos{color:#00e676;}
    .neg{color:#ff1744;}
    .neu{color:#888;}
    .status{color:#555;font-size:11px;text-align:center;margin-top:10px;}
  </style>
</head>
<body>
<div id="root">
  <div class="card">
    <div class="symbol" id="sym">Connecting...</div>
    <div class="row"><span class="lbl">5m</span><span class="val neu" id="v5m">--</span></div>
    <div class="row"><span class="lbl">1h</span><span class="val neu" id="v1h">--</span></div>
    <div class="row"><span class="lbl">1D</span><span class="val neu" id="v1d">--</span></div>
    <div class="status" id="status">Connecting...</div>
  </div>
</div>

<script type="module">
  import { createClientAdapter }    from "https://esm.sh/@spotware-web-team/sdk-external-api@0.0.5";
  import {
    registerEvent, handleConfirmEvent,
    getLightSymbolList, subscribeQuotes, quoteEvent
  } from "https://esm.sh/@spotware-web-team/sdk@0.0.9";
  import { take, tap, catchError } from "https://esm.sh/rxjs@7.8.2";

  const adapter = createClientAdapter({});

  // Store prices per symbol
  const prices   = {};
  const prevClose= {};
  let symbolMap  = {}; // name -> id
  let activeSymbols = ["XAUUSD", "XAGUSD"];

  function setStatus(msg) {
    document.getElementById("status").innerText = msg;
  }

  function updateRow(id, change) {
    const el = document.getElementById(id);
    if (change === null || isNaN(change)) { el.innerText = "--"; el.className = "val neu"; return; }
    el.innerText = (change >= 0 ? "+" : "") + change.toFixed(2) + "%";
    el.className = "val " + (change > 0 ? "pos" : change < 0 ? "neg" : "neu");
  }

  // Handshake
  handleConfirmEvent(adapter, {}).pipe(take(1)).subscribe();

  registerEvent(adapter).pipe(
    take(1),
    tap(() => {
      handleConfirmEvent(adapter, {}).pipe(take(1)).subscribe();
      setStatus("Connected ✓");
      document.getElementById("sym").innerText = "XAUUSD";
      onConnected();
    }),
    catchError(() => { setStatus("Connection failed"); return []; })
  ).subscribe();

  function onConnected() {
    // Get symbol list to find IDs
    getLightSymbolList(adapter, {}).pipe(
      take(1),
      tap(res => {
        const symbols = res?.symbolsList || res?.payload?.symbolsList || [];
        symbols.forEach(s => { symbolMap[s.symbolName] = s.symbolId; });

        // Subscribe to XAUUSD quotes
        const goldId = symbolMap["XAUUSD"];
        if (goldId) {
          subscribeQuotes(adapter, { symbolId: [goldId] }).pipe(take(1)).subscribe();
        }
      })
    ).subscribe();

    // Listen to live quotes
    quoteEvent(adapter).pipe(
      tap(q => {
        const payload = q?.payload || q;
        const symbolId = payload?.symbolId;
        const bid = payload?.bid;
        if (!bid) return;

        // find symbol name
        const symName = Object.keys(symbolMap).find(k => symbolMap[k] === symbolId);
        if (!symName) return;

        if (!prices[symName]) prices[symName] = { ticks: [], lastDay: null, lastHour: null };

        const now = Date.now();
        const tick = { price: bid, time: now };
        prices[symName].ticks.push(tick);

        // Keep only last 24h of ticks
        prices[symName].ticks = prices[symName].ticks.filter(t => now - t.time < 86400000);

        // Calculate changes
        const ticks = prices[symName].ticks;
        const now5m  = ticks.find(t => now - t.time >= 5  * 60 * 1000);
        const now1h  = ticks.find(t => now - t.time >= 60 * 60 * 1000);
        const now1d  = ticks[0];

        const change5m = now5m ? ((bid - now5m.price) / now5m.price) * 100 : null;
        const change1h = now1h ? ((bid - now1h.price) / now1h.price) * 100 : null;
        const change1d = now1d ? ((bid - now1d.price) / now1d.price) * 100 : null;

        updateRow("v5m", change5m);
        updateRow("v1h", change1h);
        updateRow("v1d", change1d);

        document.getElementById("sym").innerText = symName;
        setStatus("Live ● " + new Date().toLocaleTimeString());
      })
    ).subscribe();
  }
</script>
</body>
</html>
