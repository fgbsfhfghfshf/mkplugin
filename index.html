<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>% Change</title>
  <style>
    html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#0d0d1a;color:#fff;}
    #root{height:100%;display:flex;justify-content:center;align-items:center;padding:10px;}
    .card{background:rgba(20,20,35,0.95);border:1px solid #2a2a4a;border-radius:12px;padding:16px 24px;width:100%;max-width:340px;}
    .symbol{color:#aaa;font-size:13px;font-weight:500;text-align:center;margin-bottom:12px;letter-spacing:1px;text-transform:uppercase;}
    .row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #1e1e30;}
    .row:last-child{border-bottom:none;}
    .lbl{color:#888;font-size:18px;font-weight:600;min-width:40px;}
    .val{font-size:26px;font-weight:700;}
    .pos{color:#00e676;}
    .neg{color:#ff1744;}
    .neu{color:#888;}
    .status{color:#555;font-size:11px;text-align:center;margin-top:10px;}
  </style>
</head>
<body>
<div id="root">
  <div class="card">
    <div class="symbol" id="sym">Connecting...</div>
    <div class="row"><span class="lbl">5m</span><span class="val neu" id="v5m">--</span></div>
    <div class="row"><span class="lbl">1h</span><span class="val neu" id="v1h">--</span></div>
    <div class="row"><span class="lbl">1D</span><span class="val neu" id="v1d">--</span></div>
    <div class="status" id="status">Connecting...</div>
  </div>
</div>

<script type="module">
  import { createClientAdapter }    from "https://esm.sh/@spotware-web-team/sdk-external-api@0.0.5";
  import {
    registerEvent, handleConfirmEvent,
    getLightSymbolList, subscribeQuotes, quoteEvent, getTrendbarList
  } from "https://esm.sh/@spotware-web-team/sdk@0.0.9";
  import { take, tap, catchError } from "https://esm.sh/rxjs@7.8.2";

  const adapter  = createClientAdapter({});
  let symbolId   = null;
  let symbolName = "XAUUSD";

  function setStatus(msg) { document.getElementById("status").innerText = msg; }

  function updateRow(id, change) {
    const el = document.getElementById(id);
    if (change === null || isNaN(change)) { el.innerText = "--"; el.className = "val neu"; return; }
    el.innerText = (change >= 0 ? "+" : "") + change.toFixed(2) + "%";
    el.className = "val " + (change > 0 ? "pos" : change < 0 ? "neg" : "neu");
  }

  function calcChange(bars) {
    if (!bars || bars.length < 2) return null;
    const prev  = bars[bars.length - 2].close;
    const last  = bars[bars.length - 1].close;
    if (!prev || prev === 0) return null;
    return ((last - prev) / prev) * 100;
  }

  function loadBars() {
    if (!symbolId) return;
    const now = Date.now();

    // 5m bars - get last 2
    getTrendbarList(adapter, { symbolId, period: "M5", count: 2, toTimestamp: now })
      .pipe(take(1), tap(res => {
        const bars = res?.trendbarList || res?.payload?.trendbarList || [];
        updateRow("v5m", calcChange(bars));
      })).subscribe();

    // 1h bars - get last 2
    getTrendbarList(adapter, { symbolId, period: "H1", count: 2, toTimestamp: now })
      .pipe(take(1), tap(res => {
        const bars = res?.trendbarList || res?.payload?.trendbarList || [];
        updateRow("v1h", calcChange(bars));
      })).subscribe();

    // 1D bars - get last 2
    getTrendbarList(adapter, { symbolId, period: "D1", count: 2, toTimestamp: now })
      .pipe(take(1), tap(res => {
        const bars = res?.trendbarList || res?.payload?.trendbarList || [];
        updateRow("v1d", calcChange(bars));
      })).subscribe();

    setStatus("Updated: " + new Date().toLocaleTimeString());
    setTimeout(loadBars, 5000);
  }

  // Handshake
  handleConfirmEvent(adapter, {}).pipe(take(1)).subscribe();

  registerEvent(adapter).pipe(
    take(1),
    tap(() => {
      handleConfirmEvent(adapter, {}).pipe(take(1)).subscribe();
      setStatus("Connected ✓");

      // Get symbol list to find XAUUSD id
      getLightSymbolList(adapter, {}).pipe(
        take(1),
        tap(res => {
          const symbols = res?.symbolsList || res?.payload?.symbolsList || [];
          const gold = symbols.find(s => s.symbolName === symbolName);
          if (gold) {
            symbolId = gold.symbolId;
            document.getElementById("sym").innerText = symbolName;
            subscribeQuotes(adapter, { symbolId: [symbolId] }).pipe(take(1)).subscribe();
            loadBars();
          } else {
            setStatus("Symbol not found");
          }
        })
      ).subscribe();

      // Live quote updates
      quoteEvent(adapter).pipe(
        tap(() => { /* bars refreshed on timer */ })
      ).subscribe();
    }),
    catchError(() => { setStatus("Connection failed"); return []; })
  ).subscribe();
</script>
</body>
</html>
